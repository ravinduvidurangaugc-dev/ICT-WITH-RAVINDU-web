<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICT With Ravindu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Noto+Sans+Sinhala:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand" id="brand">ICT With Ravindu</div>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-si" type="button" aria-pressed="false">සිං</button>
        <button id="lang-en" type="button" aria-pressed="true">EN</button>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button id="theme-btn" type="button" aria-pressed="false">☾</button>
      </div>
    </div>
  </div>

  <header class="hero">
    <h1 id="h1"></h1>
    <p id="sub"></p>
  </header>

  <div class="notice" id="notice"></div>

  <section class="controls" aria-label="Filters">
    <div class="tabs" id="tabs"></div>
    <div class="search"><input id="q" type="search" autocomplete="off"></div>
    <div class="row-filters">
      <div class="field"><label for="f-level" id="l-level"></label><select id="f-level"></select></div>
      <div class="field"><label for="f-year" id="l-year"></label><select id="f-year"></select></div>
      <div class="field"><label for="f-medium" id="l-medium"></label><select id="f-medium"></select></div>
    </div>
    <div class="chips" id="chips" role="group"></div>
  </section>

  <div class="count"><span id="count"></span><button class="reset" id="reset" type="button" hidden></button></div>
  <ul class="list" id="list"></ul>
  <footer id="foot"></footer>
</div>

<script src="script.js"></script>
</body>
</html>
